name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
        with:
          version: 2026.10.12 # renovate: datasource=github-releases depName=jdx/mise

      - name: Run GoReleaser
        run: goreleaser release --clean --snapshot --skip=sign

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Preview Binaries
          path: dist/hcloud-*/hcloud

      - name: Check for release errors
        run: scripts/check-release-error.sh
